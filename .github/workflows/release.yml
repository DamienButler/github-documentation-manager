name: Release

# Build and publish installers when a version tag is pushed, e.g. `v1.0.0`.
# Can also be triggered manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      # Needed to create the draft release and upload the bundles.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # Deliberately no build cache here. This job has `contents: write` and
      # produces the binaries users download, so a poisoned cache entry from
      # another branch could end up inside a published artefact. Releases are
      # infrequent; a clean build is worth the extra minutes.
      #
      # Node is not installed either: the frontend is static HTML/CSS/JS with
      # no build step (`frontendDist` points straight at `src/`), so
      # tauri-action only needs Cargo.

      - name: Build and publish
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GitHub Documentation Manager ${{ github.ref_name }}"
          releaseBody: |
            See the assets below to download and install this version.

            **macOS:** the build is not signed with a paid Apple Developer
            certificate, so Gatekeeper will block it on first launch.
            Right-click the app → **Open** → **Open**. You only need to do
            this once.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
