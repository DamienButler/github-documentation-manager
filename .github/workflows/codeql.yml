name: CodeQL

# Static analysis for security vulnerabilities in the JavaScript frontend and
# the Rust backend. Results appear under Security → Code scanning alerts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published rules are applied to existing code.
    - cron: "24 5 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Both extractors run without building the project. The Rust extractor
        # only supports `build-mode: none`; compilation is covered separately
        # by the CI workflow.
        language: [javascript-typescript, rust]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
