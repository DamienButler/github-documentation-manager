name: CodeQL

# Static analysis for security vulnerabilities in the JavaScript frontend and
# the Rust backend. Results appear under Security → Code scanning alerts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published rules are applied to existing code.
    - cron: "24 5 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.language == 'rust' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: manual

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'

      - uses: swatinem/rust-cache@v2
        if: matrix.language == 'rust'
        with:
          workspaces: ./src-tauri -> target

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Rust
        if: matrix.language == 'rust'
        working-directory: src-tauri
        run: cargo build --locked

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
